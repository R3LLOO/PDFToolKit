<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PDF Toolkit</title>

    <link rel="stylesheet" href="popup.css">

</head>

<body>

    <div class="app">

        <!-- Header -->

        <header class="header">

            <div class="brand">

                <div class="brand-icon">
                    📄
                </div>

                <div>

                    <h1>
                        PDF Toolkit
                    </h1>

                    <p>
                        Your PDF toolbox
                    </p>

                </div>

            </div>

        </header>


        <!-- Tools -->

        <main class="tools">

            <button id="mergeButton" class="tool-button">

                <span class="tool-icon">
                    📎
                </span>

                <span class="tool-content">

                    <strong>
                        Merge PDFs
                    </strong>

                    <small>
                        Combine multiple PDFs
                    </small>

                </span>

                <span class="arrow">
                    >
                </span>

            </button>


            <button id="splitButton" class="tool-button" type="button">

                <span class="tool-icon">
                    ✂️
                </span>

                <span class="tool-content">

                    <strong>
                        Split PDF
                    </strong>

                    <small>
                        Extract pages from a PDF
                    </small>

                </span>

                <span class="arrow">
                    ›
                </span>

            </button>


            <button id="rotateButton" class="tool-button">

                <span class="tool-icon">
                    🔄
                </span>

                <span class="tool-content">

                    <strong>
                        Rotate PDF
                    </strong>

                    <small>
                        Rotate PDF pages
                    </small>

                </span>

                <span class="arrow">
                    ›
                </span>

            </button>


            <button id="extractButton" class="tool-button">

                <span class="tool-icon">
                    📄
                </span>

                <span class="tool-content">

                    <strong>
                        Extract Pages
                    </strong>

                    <small>
                        Create a PDF from selected pages
                    </small>

                </span>

                <span class="arrow">
                    ›
                </span>

            </button>


            <button class="tool-button">

                <span class="tool-icon">
                    🗜️
                </span>

                <span class="tool-content">

                    <strong>
                        Compress PDF
                    </strong>

                    <small>
                        Reduce PDF file size
                    </small>

                </span>

                <span class="arrow">
                    ›
                </span>

            </button>


            <button class="tool-button">

                <span class="tool-icon">
                    🖼️
                </span>

                <span class="tool-content">

                    <strong>
                        PDF → Images
                    </strong>

                    <small>
                        Convert PDF pages to images
                    </small>

                </span>

                <span class="arrow">
                    ›
                </span>

            </button>

        </main>


        <!-- Footer -->

        <footer class="footer">

            <span>
                PDF Toolkit
            </span>

            <span>
                v1.0.0
            </span>

        </footer>

    </div>

    <script src="popup.js"></script>

</body>

</html>
