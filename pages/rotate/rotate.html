<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rotate PDF - PDF Toolkit</title>

    <link
        rel="stylesheet"
        href="rotate.css"
    >

</head>

<body>

    <div class="app">

        <!-- HEADER -->

        <header class="header">

            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                ←
            </button>

            <div>

                <h1>
                    Rotate PDF
                </h1>

                <p>
                    Rotate selected PDF pages
                </p>

            </div>

        </header>


        <!-- MAIN -->

        <main class="main">

            <!-- UPLOAD -->

            <section class="upload-section">

                <div
                    id="dropZone"
                    class="drop-zone"
                >

                    <div class="upload-icon">
                        🔄
                    </div>

                    <h2>
                        Drop a PDF here
                    </h2>

                    <p>
                        or
                    </p>

                    <button
                        id="chooseFileButton"
                        class="primary-button"
                        type="button"
                    >
                        Choose PDF
                    </button>

                    <p class="upload-hint">
                        Select one PDF file
                    </p>

                </div>


                <input
                    id="fileInput"
                    type="file"
                    accept="application/pdf,.pdf"
                    hidden
                >

            </section>


            <!-- PDF -->

            <section
                id="pdfSection"
                class="pdf-section hidden"
            >

                <div class="pdf-header">

                    <div>

                        <h2>
                            PDF Pages
                        </h2>

                        <p id="pdfInformation">
                            0 pages
                        </p>

                    </div>

                    <button
                        id="changeFileButton"
                        class="secondary-button"
                        type="button"
                    >
                        Change PDF
                    </button>

                </div>


                <!-- PAGE CONTROLS -->

                <div class="page-controls">

                    <button
                        id="selectAllButton"
                        class="secondary-button"
                        type="button"
                    >
                        Select All
                    </button>

                    <button
                        id="clearSelectionButton"
                        class="secondary-button"
                        type="button"
                    >
                        Clear Selection
                    </button>

                </div>


                <!-- ROTATION -->

                <div class="rotation-controls">

                    <p class="control-label">
                        Rotation
                    </p>


                    <div class="rotation-buttons">

                        <button
                            class="rotation-button"
                            data-rotation="90"
                            type="button"
                        >
                            ↻ 90°
                        </button>

                        <button
                            class="rotation-button"
                            data-rotation="180"
                            type="button"
                        >
                            ↻ 180°
                        </button>

                        <button
                            class="rotation-button"
                            data-rotation="270"
                            type="button"
                        >
                            ↺ 90°
                        </button>

                    </div>

                </div>


                <!-- PAGE LIST -->

                <div
                    id="pageList"
                    class="page-list"
                >
                </div>

            </section>


            <!-- ACTION -->

            <section
                id="actionSection"
                class="action-section hidden"
            >

                <div
                    id="selectionInformation"
                    class="selection-information"
                >
                    0 pages selected
                </div>

                <button
                    id="rotateButton"
                    class="rotate-button"
                    type="button"
                    disabled
                >
                    Rotate PDF
                </button>

            </section>


            <!-- STATUS -->

            <div
                id="statusMessage"
                class="status-message hidden"
            >
            </div>

        </main>

    </div>


    <!-- PDF LIB -->

    <script src="../../lib/pdf-lib.min.js"></script>


    <!-- OUR JAVASCRIPT -->

    <script src="rotate.js"></script>

</body>

</html>
